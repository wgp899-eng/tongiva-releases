name: Archive source package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    if: github.event_name == 'workflow_dispatch' || github.event.release.tag_name == 'source-20261119'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download the source ZIP without extracting it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p package
          gh release download source-20261119 --pattern source-20261119.zip --dir package
      - name: Store the unchanged ZIP as an Actions artifact
        uses: actions/upload-artifact@v7
        with:
          name: source-20261119
          path: package/source-20261119.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
